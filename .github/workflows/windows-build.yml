name: LightingLauncher Windows Build

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build LightingLauncher (NSIS .exe)
        run: bun run tauri build --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LightingLauncher-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
